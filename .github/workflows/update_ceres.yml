name: Update CERES EEI Data

# Runs on the 15th of each month (data typically lags ~6-8 weeks,
# so by mid-month the previous month's file is usually available).
# Can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '0 6 15 * *'   # 06:00 UTC on the 15th of every month
  workflow_dispatch:         # manual trigger

jobs:
  update-eei:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run EEI update script
        run: python bibtoweb/update_eei_data.py

      - name: Commit and push if CSV changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/eei_ceres.csv
          if git diff --staged --quiet; then
            echo "No changes to data/eei_ceres.csv — nothing to commit."
          else
            git commit -m "chore: update CERES EEI data [$(date -u +%Y-%m-%d)]"
            git push
          fi
