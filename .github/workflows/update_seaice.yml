name: Update Sea Ice Data

# Runs every Monday at 06:00 UTC. NSIDC updates the daily extent files
# continuously, so weekly pulls keep the local copies reasonably current.
# PIOMAS Arctic volume is normally updated monthly but is currently stalled
# (see scripts/update_piomas_data.py) — the commit step below no-ops when
# a file is unchanged, so this is harmless to keep running weekly regardless.
# Can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * 1'   # 06:00 UTC every Monday
  workflow_dispatch:        # manual trigger

jobs:
  update-seaice:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download NSIDC sea ice extent CSVs (both hemispheres)
        run: |
          curl -fsSL \
            "https://noaadata.apps.nsidc.org/NOAA/G02135/north/daily/data/N_seaice_extent_daily_v4.0.csv" \
            -o data/N_seaice_extent_daily_v4.0.csv
          curl -fsSL \
            "https://noaadata.apps.nsidc.org/NOAA/G02135/south/daily/data/S_seaice_extent_daily_v4.0.csv" \
            -o data/S_seaice_extent_daily_v4.0.csv

      - name: Run PIOMAS Arctic sea ice volume update script
        run: python scripts/update_piomas_data.py

      - name: Commit and push if any data file changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/N_seaice_extent_daily_v4.0.csv data/S_seaice_extent_daily_v4.0.csv data/piomas_volume.csv
          if git diff --staged --quiet; then
            echo "No changes to sea ice data — nothing to commit."
          else
            git commit -m "chore: update sea ice extent and volume data [$(date -u +%Y-%m-%d)]"
            git push
          fi
