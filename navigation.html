<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML//EN">
<html> <head>
<title>Navigation Template</title>
</head>

<body>
<!-- header -->
    <div class="header">
        <div class="container">					
            <div class="logo">
                <a href="/index.html"><img src="/images/logo_b_nav.png" alt="" /></a>
            </div>
            <div class="hader-top">
                <div class="head-nav">
                    <span class="menu"> </span>
		    <ul class="cl-effect-16">
		    <!-- NOte the data-hover gets used to "swing in"
		      the text, so should match the text itself. -->
		    <!-- Note 2: li can be labeled as class="active", -->
		    <!-- but that means that text is a different -->
		    <!-- color. -->
                    <li><a href="/whatwedo.html"  data-hover="WHAT I DO">what i do</a></li>
                    <li><a href="/ourwork.html"  data-hover="PROJECTS">projects</a></li>
		    <li><a href="/aboutus.html"  data-hover="ABOUT">about</a></li>
                    <div class="clearfix"> </div>
                    </ul>
<!-- script-for-nav -->
<script>
	$( "span.menu" ).click(function() {
	  $( ".head-nav ul" ).slideToggle(300, function() {
		// Animation complete.
	  });
	});
</script>
<!-- script-for-nav --> 
                </div>
		<div class="head-right">
		    <P><a href="/contact.html">CONTACT</a></P>
		</div>
		<button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode" style="
		    background: none;
		    border: none;
		    cursor: pointer;
		    font-size: 1.3em;
		    padding: 0.4em 0.6em;
		    margin-top: 1em;
		    color: var(--color-text-dark, #474e5d);
		    transition: color 0.3s ease;
		    line-height: 1;
		">☀️</button>
		<div class="clearfix"> </div>
		</div>
		<div class="clearfix"> </div>
		</div>
	</div>

<!-- header -->

<script>
// Set initial button emoji from stored preference.
// Click handling is delegated to theme.js (loaded in page <head>).
(function() {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    btn.textContent = localStorage.getItem('theme') === 'dark' ? '🌙' : '☀️';
})();
</script>

</body> </html>
