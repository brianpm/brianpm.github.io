      tap: "https://gml.noaa.gov/aftp/data/trace_gases/co2/flask/surface/txt/co2_tap_surface-flask_1_ccgg_month.txt",
      thd: "https://gml.noaa.gov/aftp/data/trace_gases/co2/flask/surface/txt/co2_thd_surface-flask_1_ccgg_month.txt",
      tik: "https://gml.noaa.gov/aftp/data/trace_gases/co2/flask/surface/txt/co2_tik_surface-flask_1_ccgg_month.txt",
      tpi: "https://gml.noaa.gov/aftp/data/trace_gases/co2/flask/surface/txt/co2_tpi_surface-flask_1_ccgg_month.txt",
      ush: "https://gml.noaa.gov/aftp/data/trace_gases/co2/flask/surface/txt/co2_ush_surface-flask_1_ccgg_month.txt",
      uta: "https://gml.noaa.gov/aftp/data/trace_gases/co2/flask/surface/txt/co2_uta_surface-flask_1_ccgg_month.txt",
      uum: "https://gml.noaa.gov/aftp/data/trace_gases/co2/flask/surface/txt/co2_uum_surface-flask_1_ccgg_month.txt",
      wis: "https://gml.noaa.gov/aftp/data/trace_gases/co2/flask/surface/txt/co2_wis_surface-flask_1_ccgg_month.txt",
      wlg: "https://gml.noaa.gov/aftp/data/trace_gases/co2/flask/surface/txt/co2_wlg_surface-flask_1_ccgg_month.txt",
      zep: "https://gml.noaa.gov/aftp/data/trace_gases/co2/flask/surface/txt/co2_zep_surface-flask_1_ccgg_month.txt"
      // Add more sites as needed
    };
    let chart = null;
    const COLORS = [
      '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf',
      '#393b79', '#637939', '#8c6d31', '#843c39', '#7b4173', '#5254a3', '#9c9ede', '#6b6ecf', '#b5cf6b', '#cedb9c',
      '#e7ba52', '#e7969c', '#a55194', '#bd9e39', '#ad494a', '#a55194', '#ce6dbd', '#de9ed6', '#393b79', '#637939'
    ];

    async function fetchAndPlot(siteCodes) {
      if (!Array.isArray(siteCodes)) siteCodes = [siteCodes];
      document.getElementById('error-message').textContent = '';
      const datasets = [];
      let allLabels = new Set();
      const siteDataMaps = [];
      let siteIndex = 0;
      for (const siteCode of siteCodes) {
        const DATA_URL = SITE_URLS[siteCode];
        try {
          const response = await fetch(DATA_URL);
          if (!response.ok) throw new Error('Network response was not ok');
          const text = await response.text();
          const lines = text.split('\n');
          const dataStart = lines.findIndex(line => line.match(/^\w{3}/));
          const dataLines = lines.slice(dataStart);
          const dateToValue = {};
          for (const line of dataLines) {
            if (!line.trim()) continue;
            const cols = line.trim().split(/\s+/);
            if (cols.length < 4) continue;
            const year = cols[1], month = cols[2], value = cols[3];
            if (value && value !== '-999.99') {
              const date = `${year}-${month.padStart(2, '0')}`;
              dateToValue[date] = parseFloat(value);
              allLabels.add(date);
            }
          }
          siteDataMaps.push({
            label: document.querySelector(`#site option[value="${siteCode}"]`).textContent,
            color: COLORS[siteIndex % COLORS.length],
            dataMap: dateToValue
          });
          siteIndex++;
        } catch (err) {
          document.getElementById('error-message').textContent += `\nCould not load data for ${siteCode}.`;
          console.error(err);
        }
      }
      // Sort allLabels and align data
      const sortedLabels = Array.from(allLabels).sort();
      const datasetsAligned = siteDataMaps.map((site, i) => ({
        label: site.label,
        data: sortedLabels.map(date => site.dataMap[date] !== undefined ? site.dataMap[date] : null),
        borderColor: site.color,
        backgroundColor: site.color + '33',
        pointRadius: 0,
        fill: false,
        tension: 0.1,
        spanGaps: true
      }));
      if (chart) chart.destroy();
      ThemeManager.applyChartDefaults();
      chart = new Chart(document.getElementById('co2Chart'), {
        type: 'line',
        data: {
          labels: sortedLabels,
          datasets: datasetsAligned
        },
        options: {
          scales: {
            x: { title: { display: true, text: 'Year-Month' } },
            y: { title: { display: true, text: 'CO₂ (ppm)' } }
          }
        }
      });
    }

    document.getElementById('site').addEventListener('change', (e) => {
      const selected = Array.from(e.target.selectedOptions).map(opt => opt.value);
      fetchAndPlot(selected);
    });
    // Initial plot (first site)
    fetchAndPlot([document.getElementById('site').value]);

    document.addEventListener('themechange', function() {
      const selected = Array.from(document.getElementById('site').selectedOptions).map(opt => opt.value);
      fetchAndPlot(selected);
    });
  </script>
</body>
</html>
