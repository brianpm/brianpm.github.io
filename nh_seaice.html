<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Northern Hemisphere Sea Ice Extent</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<!-- Bootstrap CSS -->
<link rel="stylesheet" href="css/bootstrap.css">
<!-- Main site style -->
<link rel="stylesheet" href="css/style.css">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<style>
/* Page-specific tweaks only; main style in style.css */
#chart-container { width: 100%; max-width: 900px; margin: 2em auto; height: 500px; }
#loading-message { text-align: center; margin: 2em 0; }
#error-message { color: red; margin-top: 1em; text-align: center; }
.stats-grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
    gap: 1em; 
    margin: 2em 0; 
    max-width: 900px; 
    margin-left: auto; 
    margin-right: auto; 
}
.stat-card { 
    text-align: center; 
    padding: 1em; 
    border: 1px solid #ddd; 
    border-radius: 5px; 
    background: #f8f9fa; 
}
.stat-value { font-size: 1.8em; font-weight: bold; color: #007bff; }
.stat-label { font-size: 0.9em; color: #666; margin-top: 0.5em; }
.data-source { text-align: center; margin-top: 2em; font-size: 0.9em; color: #666; }
.sea-ice-title { margin-top: 1.5em; margin-bottom: 0.5em; }
.spinner { 
    border: 3px solid #f3f3f3; 
    border-top: 3px solid #007bff; 
    border-radius: 50%; 
    width: 40px; 
    height: 40px; 
    animation: spin 1s linear infinite; 
    margin: 0 auto 1em; 
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
<div id="nav-placeholder"></div>
    <div class="container">
        <h1 class="sea-ice-title">Northern Hemisphere Sea Ice Extent</h1>
        <p class="text-center text-muted">Daily measurements from satellite observations (1978-present)</p>
        
        <div id="chart-container">
            <div id="loading-message">
                <div class="spinner"></div>
                <p>Loading sea ice data...</p>
            </div>
            <canvas id="iceChart" style="display: none;"></canvas>
        </div>
        
        <div id="error-message" style="display: none;"></div>
        
        <div class="stats-grid" id="stats" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="currentExtent">--</div>
                <div class="stat-label">Latest Extent (10⁶ km²)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="maxExtent">--</div>
                <div class="stat-label">Maximum Extent (10⁶ km²)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="minExtent">--</div>
                <div class="stat-label">Minimum Extent (10⁶ km²)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="dataPoints">--</div>
                <div class="stat-label">Total Data Points</div>
            </div>
        </div>
        
        <div class="data-source">
            Data source: <a href="https://noaadata.apps.nsidc.org/NOAA/G02135/north/daily/data/N_seaice_extent_daily_v4.0.csv" target="_blank">
                NSIDC Sea Ice Index
            </a>
        </div>
    </div>

    <script>
        let chart;
        
        async function fetchAndPlotData() {
            try {
                const response = await fetch('data/N_seaice_extent_daily_v4.0.csv');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const csvText = await response.text();
                
                // Parse CSV with PapaParse
                const parsedData = Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    dynamicTyping: true,
                    delimitersToGuess: [',', '\t', '|', ';'],
                    transformHeader: h => h.trim()
                });
                
                if (parsedData.errors.length > 0) {
                    console.warn('CSV parsing warnings:', parsedData.errors);
                }
                
                const data = parsedData.data;
                console.log('Parsed data sample:', data.slice(0, 5));
                console.log('Data fields:', Object.keys(data[0] || {}));
                
                // Process the data
                const processedData = [];
                const validData = [];
                
                data.forEach(row => {
                    // Handle different possible column names
                    const year = row.Year || row.year || row.YYYY;
                    const month = row.Month || row.month || row.MM;
                    const day = row.Day || row.day || row.DD;
                    const extent = row.Extent || row.extent || row['Extent'] || row['Exent'];
                    
                    if (year && month && day && extent !== undefined && extent !== null) {
                        const date = new Date(year, month - 1, day);
                        const extentValue = parseFloat(extent);
                        
                        if (!isNaN(extentValue) && extentValue > 0) {
                            processedData.push({
                                date: date,
                                extent: extentValue
                            });
                            validData.push(extentValue);
                        }
                    }
                });
                
                if (processedData.length === 0) {
                    throw new Error('No valid data points found. Please check the CSV format.');
                }
                
                console.log(`Processed ${processedData.length} valid data points`);
                
                // Sort by date
                processedData.sort((a, b) => a.date - b.date);
                
                // Create chart data
                const chartData = {
                    datasets: [{
                        label: 'Sea Ice Extent (10⁶ km²)',
                        data: processedData.map(point => ({
                            x: point.date,
                            y: point.extent
                        })),
                        borderColor: '#007bff',
                        backgroundColor: 'rgba(0, 123, 255, 0.1)',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        fill: true
                    }]
                };
                
                const config = {
                    type: 'line',
                    data: chartData,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Northern Hemisphere Sea Ice Extent Over Time',
                                font: {
                                    size: 16,
                                    weight: 'bold'
                                }
                            },
                            legend: {
                                display: true
                            }
                        },
                        scales: {
                            x: {
                                type: 'time',
                                time: {
                                    unit: 'year',
                                    displayFormats: {
                                        year: 'YYYY'
                                    }
                                },
                                title: {
                                    display: true,
                                    text: 'Year'
                                }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: 'Sea Ice Extent (10⁶ km²)'
                                }
                            }
                        },
                        interaction: {
                            intersect: false,
                            mode: 'index'
                        }
                    }
                };
                
                // Hide loading and show chart
                document.getElementById('loading-message').style.display = 'none';
                const chartCanvas = document.getElementById('iceChart');
                chartCanvas.style.display = 'block';
                
                chart = new Chart(chartCanvas, config);
                
                // Update statistics
                const currentExtent = validData[validData.length - 1];
                const maxExtent = Math.max(...validData);
                const minExtent = Math.min(...validData);
                
                document.getElementById('currentExtent').textContent = currentExtent.toFixed(2);
                document.getElementById('maxExtent').textContent = maxExtent.toFixed(2);
                document.getElementById('minExtent').textContent = minExtent.toFixed(2);
                document.getElementById('dataPoints').textContent = processedData.length.toLocaleString();
                
                document.getElementById('stats').style.display = 'grid';
                
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading-message').style.display = 'none';
                const errorDiv = document.getElementById('error-message');
                errorDiv.innerHTML = `
                    <h4>Error Loading Data</h4>
                    <p>${error.message}</p>
                    <p>Please check your internet connection and try refreshing the page.</p>
                `;
                errorDiv.style.display = 'block';
            }
        }
        
        // Load data when page loads
        window.addEventListener('load', fetchAndPlotData);
        // Load nav and footer
        $('#nav-placeholder').load('navigation.html');
        $('#footer-placeholder').load('footer.html');
    </script>
  <div id="footer-placeholder"></div>
</body>
</html>
